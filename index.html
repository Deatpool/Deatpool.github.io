<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>César Monchablon — Bientôt en ligne</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'DM Sans',system-ui,sans-serif;
  --bg:#07070a;
  --accent:#0051ff;
  --text:#fff;
  --muted:rgba(255,255,255,0.5);
  --border:rgba(255,255,255,0.1);
}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* ─── Background video ───────────────────────────── */
.bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  background:#000;
}
.bg-video{
  position:absolute;top:50%;left:50%;
  min-width:100%;min-height:100%;
  width:auto;height:auto;
  transform:translate(-50%,-50%);
  object-fit:cover;
  filter:saturate(0.9) brightness(0.55);
}
.bg::after{
  content:'';position:absolute;inset:0;z-index:2;
  background:
    linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.85) 100%),
    radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;
}
.bg::before{
  content:'';position:absolute;inset:0;z-index:3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.06'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;pointer-events:none;
}

/* ─── Lang switch ─────────────────────────────────────── */
.lang-switch{
  position:fixed;top:24px;right:24px;z-index:10;
  display:flex;align-items:center;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:20px;padding:3px;gap:2px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.lang-btn{
  font:600 12px/1 var(--font);letter-spacing:.04em;
  color:rgba(255,255,255,0.4);
  padding:6px 12px;border-radius:16px;
  border:none;background:transparent;cursor:pointer;
  transition:color .2s,background .2s;
}
.lang-btn.active{background:rgba(255,255,255,0.12);color:#fff}

/* ─── Logo top-left ──────────────────────────────────── */
.brand{
  position:fixed;top:24px;left:24px;z-index:10;
  font-size:14px;font-weight:700;color:#fff;letter-spacing:-0.01em;
  text-decoration:none;
  display:flex;align-items:center;gap:10px;
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px rgba(0,81,255,.18);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px rgba(0,81,255,.18)}
  50%{box-shadow:0 0 0 8px rgba(0,81,255,.05)}
}

/* ─── Stage ────────────────────────────────────────── */
.stage{
  position:relative;z-index:1;
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
  gap:32px;
}

.badge{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;font-weight:500;letter-spacing:.02em;
  color:rgba(255,255,255,0.55);
  border:1px solid var(--border);
  border-radius:24px;padding:7px 16px;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(8px);
  opacity:0;animation:fadeUp .7s .1s forwards;
}
.badge-dot{
  width:6px;height:6px;border-radius:50%;background:#FFD60A;
  animation:dotPulse 1.6s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(0.8)}
}

h1{
  font-size:clamp(48px,9vw,128px);
  font-weight:800;letter-spacing:-0.05em;line-height:0.95;
  max-width:1100px;
  opacity:0;animation:fadeUp .8s .25s cubic-bezier(.16,1,.3,1) forwards;
}
h1 em{font-style:normal;color:rgba(255,255,255,0.3)}

.sub{
  font-size:clamp(18px,1.9vw,22px);
  font-weight:400;line-height:1.5;
  color:var(--muted);max-width:680px;
  text-wrap:pretty;
  opacity:0;animation:fadeUp .8s .4s forwards;
}

/* ─── CTA + disabled state ──────────────────────────── */
.cta-wrap{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;animation:fadeUp .8s .55s forwards;
}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  font-size:15px;font-weight:700;letter-spacing:-0.005em;
  background:#fff;color:#000;
  padding:14px 28px;border-radius:24px;text-decoration:none;
  border:none;cursor:pointer;
  transition:transform .2s,box-shadow .2s,opacity .2s;
  position:relative;
  font-family:inherit;
}
.cta:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(255,255,255,0.18);
}
.cta:disabled{
  opacity:0.45;cursor:not-allowed;
  background:rgba(255,255,255,0.5);
}
.cta-arrow{
  display:inline-block;
  transition:transform .2s;
}
.cta:hover:not(:disabled) .cta-arrow{transform:translateX(4px)}
.cta-hint{
  font-size:12px;color:rgba(255,255,255,0.3);
  letter-spacing:.02em;
}
.cta-hint.live{color:#30D158}

/* ─── Contact strip ────────────────────────────────── */
.contact{
  position:fixed;bottom:32px;left:0;right:0;
  z-index:10;
  display:flex;align-items:center;justify-content:center;gap:24px;
  font-size:13px;color:var(--muted);
  opacity:0;animation:fadeUp .8s .7s forwards;
  text-align:center;
}
.contact a{
  color:rgba(255,255,255,0.7);text-decoration:none;
  transition:color .15s;
  display:inline-flex;align-items:center;gap:5px;
}
.contact a:hover{color:#fff}
.contact-sep{color:rgba(255,255,255,0.15)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ─── Mobile ─────────────────────────────────────── */
@media (max-width:768px){
  .stage{gap:22px;padding:90px 20px 140px;justify-content:center}
  h1{font-size:clamp(36px,11vw,56px);line-height:1.02}
  .sub{font-size:16px;line-height:1.5;max-width:92%}
  .badge{font-size:11px;padding:6px 13px}
  .cta{font-size:14px;padding:13px 24px}
  .contact{
    position:fixed;bottom:18px;top:auto;left:0;right:0;transform:none;
    gap:10px 14px;font-size:11.5px;
    flex-wrap:wrap;justify-content:center;width:100%;
    padding:0 16px;
    line-height:1.6;
  }
  .contact-sep{display:none}
  .lang-switch{top:14px;right:14px}
  .brand{top:14px;left:14px;font-size:13px}
  .brand span:last-child{display:none}
}
@media (max-width:380px){
  h1{font-size:34px}
  .sub{font-size:13.5px}
}
</style>
</head>
<body>

<div class="bg">
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="asset/bg-loop.mp4" type="video/mp4"/>
  </video>
</div>

<a href="#" class="brand">
  <span>César Monchablon</span>
</a>

<div class="lang-switch">
  <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
</div>

<main class="stage">
  <div class="badge">
    <span class="badge-dot"></span>
    <span data-i18n="badge">Site en construction</span>
  </div>

  <h1 data-i18n-html="title">Repenser<br>la banque de demain.</h1>

  <p class="sub" data-i18n="sub">Je conçois des expériences numériques qui transforment la façon dont des millions d’utilisateurs épargnent et financent leurs projets de vie.</p>
</main>

<div class="contact">
  <a href="https://www.linkedin.com/in/cesar-monchablon/" target="_blank" rel="noopener">LinkedIn ↗</a>
  <span class="contact-sep">·</span>
  <a href="https://cesarmonchablon.substack.com/" target="_blank" rel="noopener">Substack ↗</a>
</div>

<script>
/* ─── CONFIGURATION ──────────────────────────────────── */
/* Pour activer le CTA et rediriger vers ton site,
   change LIVE à true et mets l'URL ci-dessous.       */
const CONFIG = {
  LIVE: false,                          // ← passe à true quand le site est prêt
  SITE_URL: 'portfolio.html',           // ← URL de destination (ex: 'https://monchablon.com')
};

/* ─── I18N ──────────────────────────────────────────── */
const TRANSLATIONS = {
  fr: {
    badge: 'Site en construction',
    title: 'Repenser<br>la banque de demain.',
    sub: 'Je conçois des expériences numériques qui transforment la façon dont des millions d’utilisateurs épargnent et financent leurs projets de vie.',
    cta: 'Site bientôt disponible',
    cta_live: 'Découvrir le site',
    hint: '',
    hint_live: 'Site en ligne',
    contact_mail: 'Me contacter',
    based: 'Lead UX Designer · Montréal',
  },
  en: {
    badge: 'Under construction',
    title: 'Reimagining<br>the banking of tomorrow.',
    sub: 'I design digital experiences that transform the way millions of users save and finance their life projects.',
    cta: 'Site coming soon',
    cta_live: 'Visit the site',
    hint: '',
    hint_live: 'Site is live',
    contact_mail: 'Get in touch',
    based: 'Lead UX Designer · Montréal',
  },
};

let currentLang = 'fr';

function applyLang(lang){
  currentLang = lang;
  const t = TRANSLATIONS[lang];
  document.getElementById('html-root').lang = lang;

  document.getElementById('btn-fr').classList.toggle('active', lang==='fr');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    let val = t[key];
    // Swap CTA copy depending on LIVE state
    if (key === 'cta')  val = CONFIG.LIVE ? t.cta_live  : t.cta;
    if (key === 'hint') val = CONFIG.LIVE ? t.hint_live : t.hint;
    if (val !== undefined) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.dataset.i18nHtml;
    if (t[key] !== undefined) el.innerHTML = t[key];
  });

  try { localStorage.setItem('lang', lang); } catch(e){}
}
function setLang(l){ applyLang(l); }

/* ─── CTA STATE ─────────────────────────────────────── */
function applyLiveState(){
  const cta  = document.getElementById('cta');
  if (!cta) return;
  cta.disabled = !CONFIG.LIVE;
}
function goToSite(){
  if (!CONFIG.LIVE) return;
  window.location.href = CONFIG.SITE_URL;
}

/* ─── INIT ──────────────────────────────────────────── */
(function(){
  // Detect language
  const saved = (() => { try { return localStorage.getItem('lang'); } catch(e){} })();
  const browserLang = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
  const detected = saved || (browserLang.startsWith('fr') ? 'fr' : 'en');
  applyLang(detected);
  applyLiveState();
})();
</script>
</body>
</html>
